databases:
  - name: knot-bloom-db
    plan: free
    databaseName: knot_bloom
    user: knot_bloom

services:
  - type: web
    name: knot-bloom-api
    runtime: python
    plan: free
    rootDir: django_backend
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: knot-bloom-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: knot-bloom-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: knot-bloom-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: knot-bloom-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
